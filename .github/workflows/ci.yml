name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — tests & lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check app tests

      - name: Format check (ruff)
        run: ruff format --check app tests

      - name: Run tests with coverage
        env:
          ENV: test
          SECRET_KEY: ci-secret-key-not-used-in-production
          FX_OFFLINE_MODE: "true"
          INTEGRATIONS_SANDBOX: "true"
          NOTIFICATIONS_DRY_RUN: "true"
          ENABLE_BACKGROUND_SCHEDULER: "false"
        run: pytest -q --cov=app --cov-report=term --cov-report=xml --cov-fail-under=80

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-xml
          path: backend/coverage.xml
          if-no-files-found: ignore

  smoke:
    name: Backend — end-to-end smoke test
    runs-on: ubuntu-latest
    needs: backend
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - run: pip install -r requirements.txt

      - name: Seed the demo database
        env:
          ENV: dev
          SECRET_KEY: ci-secret-key-not-used-in-production
          DATABASE_URL: sqlite:///./ci.db
          KEYSTORE_DIR: ./.keystore
        run: python scripts/seed.py --reset

      - name: Boot the API and exercise the critical paths
        env:
          ENV: dev
          SECRET_KEY: ci-secret-key-not-used-in-production
          DATABASE_URL: sqlite:///./ci.db
          KEYSTORE_DIR: ./.keystore
          ENABLE_BACKGROUND_SCHEDULER: "false"
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 8000 --log-level warning &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/health && break || sleep 1
          done
          bash ../scripts/smoke-test.sh http://127.0.0.1:8000

  frontend:
    name: Frontend — typecheck & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build
